[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-ant-design"
version = "0.1.0"
description = "Ant Design (antd) React components wrapped as Reflex components."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ernesto Crespo", email = "ecrespo@gmail.com" }]
keywords = [
    "reflex",
    "reflex-custom-components",
    "ant-design",
    "antd",
    "ui",
    "react",
    "components",
    "design-system",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["reflex>=0.7.0"]

[project.urls]
Homepage = "https://github.com/ecrespo/reflex-ant-design"
Repository = "https://github.com/ecrespo/reflex-ant-design"
Issues = "https://github.com/ecrespo/reflex-ant-design/issues"
Documentation = "https://github.com/ecrespo/reflex-ant-design/tree/main/docs"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "build>=1.0",
    "twine>=5.0",
    "trove-classifiers>=2024.1.1",
]

[tool.setuptools.packages.find]
where = ["custom_components"]

[tool.setuptools.package-data]
# Ship the generated type stubs (regenerated by `reflex component build`) and
# the PEP 561 marker so editors and type checkers pick up the wrapped API.
reflex_ant_design = ["*.pyi", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Generated type stubs are build artifacts; they are not hand-edited.
extend-exclude = ["*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103", "D104"]

[tool.pytest.ini_options]
pythonpath = ["custom_components"]
testpaths = ["tests"]
